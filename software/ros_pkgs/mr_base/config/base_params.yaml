# 오도메트리 노드 파라미터. 남은 것이 순수 기하학뿐인 것이 "오도메트리는 호스트,
# 제어는 MCU" 분리의 증거다. ticks_per_rev, 좌우 tick sign, 제어 주기, 게인, 시리얼
# 포트는 여기 없다. 전부 MCU 쪽이다.
mr_base:
  ros__parameters:
    # 두 값 모두 지면 주행으로 보정한 유효값이다. 반지름은 MCU 공칭값 0.050과
    # 갈리지만, 축간거리는 body 각속도 지령을 지면에서 실현하도록 MCU도 같은
    # 0.30912를 쓴다. 물리 CAD/URDF 트레드 0.264 m와는 역할이 다르다.
    wheel_radius_m: 0.04979
    wheel_separation_m: 0.30912
    odom_frame_id: odom
    base_frame_id: base_footprint
    left_wheel_joint: left_wheel_joint
    right_wheel_joint: right_wheel_joint
    publish_tf: true

    # wheel-only 오도메트리가 관측하지 못하는 자유도(z, roll, pitch)와 횡슬립을
    # 0 공분산으로 숨기지 않는다. 관측하는 x/y/yaw도 완전하지 않으므로 유한한 값을 준다.
    # 시작값이며, IMU와 EKF를 붙일 때 다시 맞춘다.
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 1000000.0, 1000000.0, 1000000.0, 1000000.0, 0.01]
