# align 노드 — 고정 마커 정렬.
#
# 게인은 maknae mm_control/config/align.yaml에서 승계했다. 그쪽은 시뮬에서만
# 검증됐고 실기 폐루프는 끝까지 확인된 적이 없다(maknae ROADMAP). 실측으로 다시 잡을 것.
#
# 게인 값은 그대로 두고 **제어법만 고쳤다(2026-08-28)** — 앞의 두 단계가 마커 중심이
# 아니라 진입점(마커 법선 위 standoff 지점)을 조준한다. 승계본은 횡방향 오차를 닫는
# 항이 없어 법선 축에서 벗어나 출발하면 시작 오프셋의 약 1/4이 그대로 남았다.
align:
  ros__parameters:
    control_rate_hz: 20.0
    cmd_frame_id: base_footprint
    abort_on_oscillation: true

    # 0.45 m는 base_footprint 기준이라 카메라에서는 0.20 m뿐이고, 0.15 m 마커는
    # 그 거리에서 41도를 차지한다(오른쪽 화각 32.10도). 그래도 이 값을 그대로
    # 두는 이유는 아래 `fov_keep_rad` 원뿔이 거리에 따라 좁아져 종반에 마커를
    # 화면 가운데로 붙잡아 주기 때문이다 — 폐루프 시험에서 0.45/0.50/0.60이
    # 모두 통과했고 최악 화각 여유만 0.028 / 0.031 / 0.035 rad로 달랐다.
    # 여유가 더 필요하면 그때 올린다. 세로 대역(M7-M13.md 335~337행)은 별개
    # 문제이고, 마커를 카메라 광축 높이에 다는 것으로 푼다.
    standoff_m: 0.45

    # 바닥에서 작은 조향이 실행되지 않는 구간을 불연속 최소값으로 올리면
    # 진입점 방위가 0을 지날 때 ±0.20 rad/s로 뒤집혀 횡진동이 커졌다.
    # 비례 게인을 2배로 보상해 0에서는 연속이고 필요한 구간만 breakaway를 넘긴다.
    k_bearing: 2.8
    k_dist: 0.8
    k_final_yaw: 0.6

    # 추종보다 느리다. 거리가 짧고 목적이 정밀도다.
    # 횡오차가 남은 채 진입점에 먼저 도착하지 않도록 조향에 시간을 준다.
    max_linear_mps: 0.10
    # 0.30 rad/s는 바닥 양방향 실행률 53~72%로 안정적이었다. 0.5 이상은
    # YAW 단계에서 진입점 허용띠를 지나쳐 카메라 시야를 벗어났다.
    max_angular_rps: 0.30
    max_linear_accel: 0.5
    max_angular_accel: 2.5
    min_linear_mps: 0.004
    min_angular_rps: 0.008
    # 제자리 회전에만 적용한다. 2026-08-30 바닥 실측에서 0.20 rad/s는 실제
    # 회전이 20~23%뿐이었고, 0.30 rad/s부터 양방향 정지마찰을 넘어 53~72%로
    # 회전했다. 주행 중 조향에 적용하면 DISTANCE 진입 때 마커를 시야 밖으로 민다.
    # wheels-up odom은 바퀴 회전을 차체 회전으로 오인하므로 근거로 쓰지 않는다.
    min_turn_rps: 0.30

    # ---- 시야 유지 (2026-08-30 M12-2 실패 대응)
    # 정렬 제어법에는 "마커를 계속 봐야 한다"는 조건이 없었다. 진입점 조준이
    # ±0.035 rad로 정확한 채로 로봇이 호를 그렸고, 마커가 화면 오른쪽으로 밀려
    # 10.6 s에 MARKER_LOST가 났다. 아래 셋이 그 조건을 건다.
    #
    # 카메라 전방 오프셋. mr_description TF 실측 [0.250, 0, 0.410]. 제자리
    # 회전은 base_footprint를 축으로 도는데 카메라는 이 반경 호를 그리므로,
    # 마커의 카메라 기준 방위는 본체 기준보다 항상 크게 벌어진다.
    camera_forward_m: 0.250
    # 마커 중심을 붙잡아 둘 시선 주위 반각의 상한. 오른쪽 실측 화각이
    # 0.560 rad이므로 0.060 rad를 여유로 남긴다 — 회전 중 카메라가 그리는 호,
    # odom 오차, 검출 여유가 그 안에 들어간다.
    fov_keep_rad: 0.50
    # 실제 원뿔은 거리마다 다르다: keep(r) = fov_keep_rad - atan(marker_half_m/r).
    # 검출에는 네 꼭짓점이 다 보여야 하고 모서리가 차지하는 각은 가까울수록
    # 커지기 때문이다. 고정 원뿔로는 안 됐다 — 좁히면 큰 횡오차를 지우는 선회를
    # 막아 수렴이 깨졌고, 넓히면 종반에 마커가 잘렸다.
    marker_half_m: 0.075         # aruco_tracker.yaml marker_size 0.15의 절반
    fov_keep_min_rad: 0.10       # 아주 가까울 때 조향이 얼지 않게 하는 바닥

    # 단계 전이 히스테리시스. 문턱이 하나면 접근 중에 두 단계를 왕복한다.
    yaw_enter_tol_rad: 0.06
    yaw_exit_tol_rad: 0.20
    # 진입점까지 남은 거리가 이만큼이면 FINAL. goal의 위치 허용오차가 더 크면 그쪽.
    dist_enter_tol_m: 0.03

    stale_timeout_s: 0.4         # 낡으면 정지하고 기다린다 (실패 아님)
    loss_timeout_s: 3.0          # 그 상태가 이어지면 실패
    oscillation_window: 30
    oscillation_flips: 8
    # 실행되지 않는 미소 보정의 부호 반전은 차체 발진으로 세지 않는다.
    oscillation_min_angular_rps: 0.15

    # goal이 0을 주면 쓰는 기본 허용오차.
    default_dist_tol_m: 0.04
    default_yaw_tol_rad: 0.14
    default_stable_time_s: 1.0
    default_timeout_s: 60.0
