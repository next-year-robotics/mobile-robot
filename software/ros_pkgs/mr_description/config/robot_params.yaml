# Integration copy of hardware/mobile_base/robot_params.yaml.
# Length units are metres; mesh files are generated in millimetres.
base_link_z_m: 0.050

camera_optical_xyz_m: [0.250, 0.000, 0.360]
camera_mount_rpy_deg: [0.0, 0.0, 0.0]
camera_box_size_m: [0.024, 0.094, 0.029]  # x depth, y width, z height

chassis_frame_size_m: [0.450, 0.400, 0.368]
chassis_frame_centre_from_base_link_m: [0.025, 0.000, 0.222517313]

wheel_separation_m: 0.264
wheel_radius_m: 0.050
wheel_width_m: 0.024

# IMU (ICM-42688-P on the base interface board, J11) -> imu_link.
# Position measured on the mounted robot (2026-10-31): 160 mm right of the
# drive-axle midpoint, 240 mm behind the aluminium-frame front face (x = +0.250),
# and 140 mm above the floor (base_link is 50 mm up).
# Orientation measured by driving (2026-10-31): sensor X points backward, so
# yaw is about 180 deg, 2.5 deg short of it (forward/back accelerations, four
# runs within 1 deg). Roll/pitch come from the gravity component that stays
# fixed in the sensor through a full in-place turn (floor slope 0.17 deg removed).
# They also hold the accelerometer zero-g offset, which cannot be separated
# without flipping the board; with them, gravity lies on base_link +Z on a flat floor.
imu_xyz_m: [0.010, -0.160, 0.090]
imu_rpy_deg: [-1.0, 2.1, 177.5]

# The independent CAD preserves the measured cart STEP origin.  Apply this
# translation in base_link before the millimetre STL is scaled to metres.
cart_frame_mesh_origin_from_base_link_m: [0.025, 0.000, -0.043482687]
mesh_scale_m_per_mm: 0.001

# The link-mass budget sums to the measured complete-robot mass. Individual
# allocations remain dynamics placeholders until final part mass properties are
# measured; chassis includes frame, casters, spring drives, motors, and hardware.
total_mass_kg: 9.8
chassis_mass_kg: 8.6
wheel_mass_kg: 0.5
camera_mass_kg: 0.2
