# C920 내부 파라미터 — 2026-08-29 재캘리브레이션.
#
# 조건: 1280x720 MJPEG, focus_automatic_continuous=0, focus_absolute=0.
# 7x10 내부 코너, 25 mm 정사각형 체커보드를 단단한 평판에 고정해 27개 자세를
# 수집했다. 전체 재투영 RMS는 0.513 px, 최악 자세는 0.975 px였다.
#
# **해상도와 초점을 바꾸면 다시 캘리브레이션할 것.** fx/fy/cx/cy는 모두 위 조건에
# 종속된다. 이 값에서 계산한 FOV는 수평 67.6도, 수직 41.3도다.
#
# maknae 승계값(fx=1024.34, fy=1018.98)은 150 mm ArUco 실측에서 거리에 비례한
# 과대편향을 보여 폐기했다. 이 새 값도 1.0/2.0 m 재검증에서 렌즈축 거리를
# 각각 +4.21/+8.11 cm 과대 추정해 거리 정확도는 FAIL이다. 원인을 해결하기 전까지
# 이 YAML을 정밀 거리 판정의 통과 값으로 취급하지 않는다.
# 운용 ArUco 경로는 mr_aruco/marker_track에서 카메라 상대 병진벡터에
# 0.960729786을 곱하며, 독립적인 1.5 m 홀드아웃에서 -0.60 cm로 통과했다.
# 이는 후단 실측 보정이며 본 YAML의 원시 PnP 스케일 한계를 없애지 않는다.
