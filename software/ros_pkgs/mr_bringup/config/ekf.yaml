# robot_localization EKF. 바퀴 /odom과 자이로 /imu/data를 합쳐 odom → base_footprint를 낸다.
#
# 이 노드가 뜨면 TF odom → base_footprint의 주인은 EKF다. mr_base odom_node는 /odom 토픽만
# 내고 TF는 끈다(launch_common.build_base가 publish_tf를 false로 덮는다). 한 칸을 둘이 내면
# TF가 두 자세 사이를 오간다.
#
# /odom(바퀴만)은 그대로 남는다. mr_mission 정지 판정과 부스 대시보드가 쓴다.
# 융합 결과는 /odometry/filtered다.
ekf_filter_node:
  ros__parameters:
    # 입력은 /odom 50 Hz, /imu/data 100 Hz다. 출력은 30 Hz로 둔다. follow 스택에서
    # aruco_tracker와 usb_cam이 Pi CPU를 거의 다 써서(부하 7.7) 50 Hz로는 주기를 5분에
    # 40번 놓쳤다(2026-11-10). 측정은 stamp 순서대로 다 반영되고 출력만 성겨진다.
    frequency: 30.0
    sensor_timeout: 0.1
    # 평면 주행. z, roll, pitch와 그 속도를 0으로 묶는다.
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint      # mr_base base_params.yaml base_frame_id와 같아야 한다
    world_frame: odom

    # 순서: x y z / roll pitch yaw / vx vy vz / vroll vpitch vyaw / ax ay az
    #
    # 바퀴는 속도만 넣는다. 위치를 넣으면 같은 적분을 두 번 하는 셈이다.
    # vy는 넣지 않는다. odom_node가 횡슬립을 관측하지 못한다고 1e6 공분산으로 내므로 넣어도
    # 효과가 없다. 측정이 없는 vy는 다른 상태와 상관이 생기지 않아 0에 머문다.
    # vyaw는 IMU가 끊겼을 때를 위해 남긴다. 자이로가 있으면 공분산 비(1e-2 대 6e-8) 때문에
    # 회전은 거의 자이로를 따른다. 바퀴 회전량은 이 바닥에서 자이로보다 12.5 % 적다(base_interface_revB 2f절).
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # 자이로 z만 넣는다.
    # - orientation: MCU가 내지 않는다(6축, 자력계 없음, orientation_covariance[0] = -1).
    # - 가속도: 두 번 적분하면 발산하고, 진동이 차동구동 가속보다 크다.
    # 축 회전은 tf base_footprint → imu_link(URDF, 센서 X가 뒤쪽)로 EKF가 한다.
    # robot_state_publisher가 같이 떠 있어야 하는 이유다.
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
